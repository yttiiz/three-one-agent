[project]
name = "ai-agent"
version = "0.1.0"
description = "AI agent based on Gemini model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.31.0",
    "pydantic-settings>=2.16.0",
    "tavily>=1.1.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "requests>=2.34.2",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
lines-after-imports = 2
lines-between-types = 1
no-sections = true

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
fix = "ruff check . --fix"
main = "uv run main.py"
